apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lumitree
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AobaIwaki123/lumitree'
    targetRevision: release
    path: k8s/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: lumitree
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
