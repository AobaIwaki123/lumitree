apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lumitree
spec:
  project: default
  source:
    repoURL: 'https://github.com/AobaIwaki123/lumitree'
    targetRevision: HEAD
    path: k8s/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: lumitree
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
