changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: '🚀 新機能・機能改善 (Features)'
      labels:
        - feat
        - enhancement
    - title: '🐛 バグ修正 (Bug Fixes)'
      labels:
        - fix
        - bug
    - title: '📚 ドキュメント (Documentation)'
      labels:
        - docs
        - documentation
    - title: '⚙️ CI / 開発基盤 (Maintenance)'
      labels:
        - ci
        - chore
        - refactor
        - '*'
