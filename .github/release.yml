changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: "🚀 新機能 (New Features)"
      labels:
        - feature
        - feat
        - enhancement
    - title: "🐛 バグ修正 (Bug Fixes)"
      labels:
        - fix
        - bug
        - bugfix
    - title: "📝 ドキュメント (Documentation)"
      labels:
        - docs
        - documentation
    - title: "🧪 テスト & 品質向上 (Tests & Quality)"
      labels:
        - test
        - testing
        - refactor
    - title: "⚙️ CI/CD & 自動化・インフラ (CI/CD & DevOps)"
      labels:
        - ci
        - chore
        - build
        - k8s
