name: Live API Monitoring

on:
  schedule:
    # Runs daily at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  canary-check:
    name: Canary Live Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build lumitree CLI
        run: go build -o lumitree ./cmd/lumitree

      - name: Test live TimeTree public calendar fetch
        run: |
          echo "Checking live TimeTree API connectivity..."
          ./lumitree get ilife_official --json > /tmp/live_events.json
          COUNT=$(grep -o '"title":' /tmp/live_events.json | wc -l)
          echo "Successfully fetched $COUNT events from live TimeTree."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No events found or live API response format changed!"
            exit 1
          fi

      - name: Test live iCalendar generation
        run: |
          ./lumitree ics ilife_official > /tmp/live_events.ics
          if ! grep -q "BEGIN:VCALENDAR" /tmp/live_events.ics; then
            echo "::error::iCalendar export failed on live data!"
            exit 1
          fi
          echo "iCalendar generation verified successfully."
