name: CI - Release Container Image

on:
  pull_request:
    branches:
      - release
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Release Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Release Version Tag
        id: version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --tags origin || true
          if [[ "$HEAD_REF" == release-stage/* ]]; then
            TAG="${HEAD_REF#release-stage/}"
          else
            PREV_TAG=$(git tag -l 'v*' | sort -V | tail -n 1)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG="v1.0.0"
            fi
            CLEAN_VER=$(echo "$PREV_TAG" | sed -E 's/^(lumitree-)?v?//')
            MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
            NEXT_MINOR=$((MINOR + 1))
            TAG="v${MAJOR}.${NEXT_MINOR}.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Calculated release container tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Repository Name to Lowercase
        id: repo
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and Pre-push Docker Release Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.repo.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.repo.outputs.image }}:latest
            ${{ steps.repo.outputs.image }}:release
          cache-from: type=gha
          cache-to: type=gha,mode=max
