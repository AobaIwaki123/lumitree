name: Tag on Release Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - release

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  tag-and-release:
    name: Create Release Tag, Publish Release & Push Container
    # Only run if PR was merged into release branch
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: false

      - name: Calculate Next Version
        id: version
        run: |
          git fetch --tags origin || true
          PREV_TAG=$(git tag -l 'v*' | sort -V | tail -n 1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="v1.0.0"
          fi
          echo "Previous tag: ${PREV_TAG}"
          CLEAN_VER=$(echo "$PREV_TAG" | sed -E 's/^(lumitree-)?v?//')
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          NEXT_TAG="v${MAJOR}.${NEXT_MINOR}.0"
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Calculated next tag: ${NEXT_TAG}"

      - name: Create and Push Tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Successfully pushed tag ${TAG}!"

      - name: Prepare Release Notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Preparing clean release notes from Release PR..."
          if [ -n "$PR_BODY" ]; then
            echo "$PR_BODY" > /tmp/RELEASE_NOTES.md
          else
            echo "Release ${{ steps.version.outputs.tag }}" > /tmp/RELEASE_NOTES.md
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes /tmp/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Repository Name to Lowercase
        id: repo
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Release Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.repo.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.repo.outputs.image }}:latest
            ${{ steps.repo.outputs.image }}:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up Staging Branch
        env:
          STAGE_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$STAGE_REF" == release-stage/* ]]; then
            echo "Deleting temporary staging branch: ${STAGE_REF}..."
            git push origin --delete "${STAGE_REF}" || true
          fi
