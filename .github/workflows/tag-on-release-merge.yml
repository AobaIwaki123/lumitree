name: Tag on Release Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - release

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  create-tag:
    name: Create Release Tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Calculate Next Version
        id: version
        run: |
          git fetch --tags origin || true
          PREV_TAG=$(git tag -l 'v*' | sort -V | tail -n 1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="v1.0.0"
          fi
          echo "Previous tag: ${PREV_TAG}"
          CLEAN_VER=$(echo "$PREV_TAG" | sed -E 's/^(lumitree-)?v?//')
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          NEXT_TAG="v${MAJOR}.${NEXT_MINOR}.0"
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Calculated next tag: ${NEXT_TAG}"

      - name: Create and Push Tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Successfully pushed tag ${TAG}!"

  publish-release:
    name: Publish GoReleaser Release
    needs: [create-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
          cache: false

      - name: Prepare Release Notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Preparing clean release notes from Release PR..."
          if [ -n "$PR_BODY" ]; then
            echo "$PR_BODY" > /tmp/RELEASE_NOTES.md
          else
            echo "Release ${{ needs.create-tag.outputs.tag }}" > /tmp/RELEASE_NOTES.md
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes /tmp/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Clean up Staging Branch
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete Temporary Staging Branch
        env:
          STAGE_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$STAGE_REF" == release-stage/* ]]; then
            echo "Deleting temporary staging branch: ${STAGE_REF}..."
            git push origin --delete "${STAGE_REF}" || true
          fi
