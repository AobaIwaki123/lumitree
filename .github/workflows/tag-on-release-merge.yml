name: Tag on Release Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - release

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-and-release:
    name: Create Release Tag & Notes
    # Only run if PR was merged into release branch
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: false

      - name: Calculate Next Version
        id: version
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Previous tag: ${PREV_TAG}"
          # Strip 'v' and 'lumitree-v' prefixes
          CLEAN_VER=$(echo "$PREV_TAG" | sed -E 's/^(lumitree-)?v?//')
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_VER" | cut -d. -f3)
          NEXT_MINOR=$((MINOR + 1))
          NEXT_TAG="v${MAJOR}.${NEXT_MINOR}.0"
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Calculated next tag: ${NEXT_TAG}"

      - name: Create and Push Tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Successfully pushed tag ${TAG}!"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
